<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudentHub | Events</title>

    <link rel="stylesheet" href="css/events.css">

</head>


<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            StudentHub
        </div>

        <nav class="nav-links">

        <a href="dashboard.html">Dashboard</a>
        <a href="courses.html">Courses</a>
        <a href="assignments.html">Assignments</a>
        <a href="results.html">Results</a>
        <a href="login.html">Logout</a>

        </nav>

    </header>


    <!-- ================= PAGE HEADER ================= -->

    <section class="events-header">

        <div class="header-content">

            <span class="small-title">
                STUDENTHUB
            </span>

            <h1>
                Student Events
            </h1>

            <p>
                Discover workshops, competitions, seminars
                and other exciting activities.
            </p>

        </div>

    </section>


    <!-- ================= SEARCH AREA ================= -->

    <section class="filter-section">

        <div class="filter-box">

            <div class="search-box">

                <span>🔍</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search events..."
                >

            </div>


            <select id="categoryFilter">

                <option value="all">
                    All Categories
                </option>

                <option value="Workshop">
                    Workshop
                </option>

                <option value="Technical">
                    Technical
                </option>

                <option value="Competition">
                    Competition
                </option>

                <option value="Sports">
                    Sports
                </option>

                <option value="Seminar">
                    Seminar
                </option>

            </select>


            <select id="sortOption">

                <option value="default">
                    Sort By
                </option>

                <option value="title">
                    Title A-Z
                </option>

                <option value="date">
                    Date
                </option>

            </select>

        </div>

    </section>


    <!-- ================= LOADING ================= -->

    <p id="loading">
        Loading events...
    </p>


    <!-- ================= ERROR ================= -->

    <p id="error"></p>


    <!-- ================= EVENTS ================= -->

    <main>

        <div id="eventContainer"></div>

    </main>


    <!-- ================= PAGINATION ================= -->

    <div id="pagination"></div>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            © 2026 StudentHub. All Rights Reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="js/events.js"></script>

</body>

</html>
