<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>StudentHub | Events</title>

    <link rel="stylesheet" href="css/events.css">

</head>


<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            StudentHub
        </div>

        <nav class="nav-links" id="mainNav">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="courses.html">Courses</a>
            <a href="events.html" style="color:#6C63FF; font-weight:700;">Events</a>
            <a href="login.html">Student Login</a>
            <a href="registration.html">Student Register</a>
            <a href="admin_login.html">Admin 🛡️</a>
        </nav>

    </header>


    <!-- ================= PAGE HEADER ================= -->

    <section class="events-header">

        <div class="header-content">

            <span class="small-title">
                STUDENTHUB
            </span>

            <h1>
                Student Events
            </h1>

            <p>
                Discover workshops, competitions, seminars
                and other exciting activities.
            </p>

        </div>

    </section>


    <!-- ================= SEARCH AREA ================= -->

    <section class="filter-section">

        <div class="filter-box">

            <div class="search-box">

                <label for="searchInput" class="sr-only">Search Events</label>
                <span>🔍</span>
                <input
                    type="text"
                    id="searchInput"
                    aria-label="Search events by title or keyword"
                    placeholder="Search events..."
                >

            </div>


            <label for="categoryFilter" class="sr-only">Category Filter</label>
            <select id="categoryFilter" aria-label="Filter events by category">

                <option value="all">
                    All Categories
                </option>

                <option value="Workshop">
                    Workshop
                </option>

                <option value="Technical">
                    Technical
                </option>

                <option value="Competition">
                    Competition
                </option>

                <option value="Sports">
                    Sports
                </option>

                <option value="Seminar">
                    Seminar
                </option>

            </select>


            <label for="sortOption" class="sr-only">Sort Events</label>
            <select id="sortOption" aria-label="Sort events">

                <option value="default">
                    Sort By
                </option>

                <option value="title">
                    Title A-Z
                </option>

                <option value="date">
                    Date
                </option>

            </select>

        </div>

    </section>


    <!-- ================= LOADING ================= -->

    <p id="loading">
        Loading events...
    </p>


    <!-- ================= ERROR ================= -->

    <p id="error"></p>


    <!-- ================= EVENTS ================= -->

    <main id="main-content">

        <div id="eventContainer"></div>

    </main>


    <!-- ================= PAGINATION ================= -->

    <div id="pagination"></div>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            © 2026 StudentHub. All Rights Reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="js/events.js"></script>
    <script src="js/nav.js"></script>
</body>

</html>
