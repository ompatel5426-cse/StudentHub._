<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <style>

        /* =========================
           GLOBAL STYLING
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2,
                    #6a11cb,
                    #2575fc
                );

            background-size: 400% 400%;
            animation: backgroundAnimation 12s ease infinite;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }

        @keyframes backgroundAnimation {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }


        /* =========================
           MAIN CONTAINER
        ========================== */

        .container {
            width: 600px;
            max-width: 100%;

            background: rgba(255, 255, 255, 0.95);

            padding: 40px;

            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

            animation: formAnimation 0.8s ease;

            position: relative;
            overflow: hidden;
        }

        @keyframes formAnimation {

            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* Decorative top line */

        .container::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 6px;

            background: linear-gradient(
                90deg,
                #667eea,
                #764ba2,
                #2575fc
            );
        }


        /* =========================
           HEADER
        ========================== */

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .icon {
            width: 75px;
            height: 75px;

            margin: auto;
            margin-bottom: 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;

            font-size: 35px;

            box-shadow:
                0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .header h1 {
            color: #222;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
            font-size: 14px;
        }


        /* =========================
           FORM GROUP
        ========================== */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #333;

            font-size: 14px;

            font-weight: bold;
        }


        /* =========================
           INPUT BOX
        ========================== */

        .input-box {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 18px;

            color: #667eea;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"],
        select {

            width: 100%;

            padding: 13px 15px 13px 45px;

            border: 2px solid #e0e0e0;

            border-radius: 10px;

            font-size: 15px;

            background: #fafafa;

            transition: 0.3s;
        }

        select {
            padding-left: 15px;
        }

        input:focus,
        select:focus {

            outline: none;

            border-color: #667eea;

            background: white;

            box-shadow:
                0 0 0 4px rgba(102, 126, 234, 0.12);
        }


        /* =========================
           PASSWORD SHOW BUTTON
        ========================== */

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 50px;
        }

        .show-password {

            position: absolute;

            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: none;

            cursor: pointer;

            font-size: 18px;

            color: #667eea;
        }


        /* =========================
           SELECT
        ========================== */

        select {
            cursor: pointer;
        }


        /* =========================
           GENDER
        ========================== */

        .gender-container {

            display: flex;

            gap: 15px;

            flex-wrap: wrap;
        }

        .gender-option {

            flex: 1;

            min-width: 100px;
        }

        .gender-option input {
            display: none;
        }

        .gender-option label {

            display: block;

            padding: 12px;

            text-align: center;

            border: 2px solid #e0e0e0;

            border-radius: 10px;

            cursor: pointer;

            color: #555;

            transition: 0.3s;
        }

        .gender-option input:checked + label {

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;

            border-color: #667eea;

            box-shadow:
                0 5px 15px rgba(102, 126, 234, 0.3);
        }


        /* =========================
           TERMS
        ========================== */

        .terms {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 10px;
        }

        .terms input {

            width: 18px;
            height: 18px;

            cursor: pointer;

            accent-color: #586ecd;
        }

        .terms label {

            margin: 0;

            font-size: 13px;

            color: #555;

            cursor: pointer;
        }


        /* =========================
           ERROR MESSAGE
        ========================== */

        .error {

            color: #e74c3c;

            font-size: 12px;

            margin-top: 6px;

            min-height: 15px;
        }


        /* =========================
           BUTTON
        ========================== */

        button[type="submit"] {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #0b2cc0,
                #100dc1
            );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 8px 20px rgba(102, 126, 234, 0.3);
        }

        button[type="submit"]:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:active {

            transform: translateY(0);
        }


        /* =========================
           SUCCESS MESSAGE
        ========================== */

        .success {

            text-align: center;

            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            background: #e8f8f0;

            color: #219653;

            font-weight: bold;

            display: none;
        }


        /* =========================
           FOOTER
        ========================== */

        .footer {

            text-align: center;

            margin-top: 25px;

            font-size: 12px;

            color: #888;
        }


        /* =========================
           MOBILE RESPONSIVE
        ========================== */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 25px;
            }

            .gender-container {
                flex-direction: column;
            }

            .gender-option {
                width: 100%;
            }
        }

    </style>
</head>


<body>

    <div class="container">

        <!-- =========================
             HEADER
        ========================== -->

        <div class="header">

            <div class="icon">
                🎓
            </div>

            <h1>Student Registration</h1>

            <p>
                Create your student account
            </p>

        </div>


        <!-- =========================
             REGISTRATION FORM
        ========================== -->

        <form id="registrationForm">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                    >

                </div>

                <div
                    id="nameError"
                    class="error">
                </div>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        ✉️
                    </span>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@gmail.com"
                    >

                </div>

                <div
                    id="emailError"
                    class="error">
                </div>

            </div>


            <!-- MOBILE -->

            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        📱
                    </span>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter 10 digit mobile number"
                    >

                </div>

                <div
                    id="mobileError"
                    class="error">
                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a strong password"
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('password', this)">
                        👁️
                    </button>

                </div>

                <div
                    id="passwordError"
                    class="error">
                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirmPassword', this)">
                        👁️
                    </button>

                </div>

                <div
                    id="confirmPasswordError"
                    class="error">
                </div>

            </div>


            <!-- COURSE -->

            <div class="form-group">

                <label for="course">
                    Select Course
                </label>

                <select id="course">

                    <option value="">
                        -- Select Course --
                    </option>

                    <option value="BCA">
                        BCA
                    </option>

                    <option value="BSc IT">
                        BSc IT
                    </option>

                    <option value="B.Tech">
                        B.Tech
                    </option>

                    <option value="MCA">
                        MCA
                    </option>

                    <option value="MSc IT">
                        MSc IT
                    </option>

                </select>

                <div
                    id="courseError"
                    class="error">
                </div>

            </div>


            <!-- YEAR -->

            <div class="form-group">

                <label for="year">
                    Academic Year
                </label>

                <select id="year">

                    <option value="">
                        -- Select Year --
                    </option>

                    <option value="1">
                        First Year
                    </option>

                    <option value="2">
                        Second Year
                    </option>

                    <option value="3">
                        Third Year
                    </option>

                    <option value="4">
                        Fourth Year
                    </option>

                </select>

                <div
                    id="yearError"
                    class="error">
                </div>

            </div>


            <!-- GENDER -->

            <div class="form-group">

                <label>
                    Gender
                </label>

                <div class="gender-container">


                    <div class="gender-option">

                        <input
                            type="radio"
                            id="male"
                            name="gender"
                            value="Male"
                        >

                        <label for="male">
                            👨 Male
                        </label>

                    </div>


                    <div class="gender-option">

                        <input
                            type="radio"
                            id="female"
                            name="gender"
                            value="Female"
                        >

                        <label for="female">
                            👩 Female
                        </label>

                    </div>


                    <div class="gender-option">

                        <input
                            type="radio"
                            id="other"
                            name="gender"
                            value="Other"
                        >

                        <label for="other">
                            🧑 Other
                        </label>

                    </div>

                </div>

                <div
                    id="genderError"
                    class="error">
                </div>

            </div>


            <!-- TERMS -->

            <div class="form-group">

                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                    >

                    <label for="terms">

                        I accept the
                        terms and conditions.

                    </label>

                </div>

                <div
                    id="termsError"
                    class="error">
                </div>

            </div>


            <!-- SUBMIT -->

            <button type="submit">

                🚀 Create Account

            </button>


            <!-- SUCCESS -->

            <div
                id="successMessage"
                class="success">

                ✅ Registration Successful!

            </div>


        </form>


        <div class="footer">

            © 2026 Student Registration Portal

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>


        /* =========================
           PASSWORD SHOW / HIDE
        ========================== */

        function togglePassword(inputId, button) {

            let passwordInput =
                document.getElementById(inputId);

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                button.textContent = "🙈";

            }
            else {

                passwordInput.type = "password";

                button.textContent = "👁️";

            }

        }


        /* =========================
           FORM VALIDATION
        ========================== */

        document
            .getElementById("registrationForm")
            .addEventListener("submit", function(event) {


                // Stop form from submitting
                event.preventDefault();


                /* =========================
                   GET VALUES
                ========================== */

                let name =
                    document.getElementById("name").value.trim();

                let email =
                    document.getElementById("email").value.trim();

                let mobile =
                    document.getElementById("mobile").value.trim();

                let password =
                    document.getElementById("password").value;

                let confirmPassword =
                    document.getElementById("confirmPassword").value;

                let course =
                    document.getElementById("course").value;

                let year =
                    document.getElementById("year").value;

                let gender =
                    document.querySelector(
                        'input[name="gender"]:checked'
                    );

                let terms =
                    document.getElementById("terms").checked;


                /* =========================
                   ERROR ELEMENTS
                ========================== */

                let nameError =
                    document.getElementById("nameError");

                let emailError =
                    document.getElementById("emailError");

                let mobileError =
                    document.getElementById("mobileError");

                let passwordError =
                    document.getElementById("passwordError");

                let confirmPasswordError =
                    document.getElementById(
                        "confirmPasswordError"
                    );

                let courseError =
                    document.getElementById("courseError");

                let yearError =
                    document.getElementById("yearError");

                let genderError =
                    document.getElementById("genderError");

                let termsError =
                    document.getElementById("termsError");

                let successMessage =
                    document.getElementById(
                        "successMessage"
                    );


                /* =========================
                   CLEAR OLD ERRORS
                ========================== */

                nameError.textContent = "";

                emailError.textContent = "";

                mobileError.textContent = "";

                passwordError.textContent = "";

                confirmPasswordError.textContent = "";

                courseError.textContent = "";

                yearError.textContent = "";

                genderError.textContent = "";

                termsError.textContent = "";

                successMessage.style.display = "none";


                let isValid = true;


                /* =========================
                   REGULAR EXPRESSIONS
                ========================== */


                // Name
                let nameRegex =
                    /^[A-Za-z ]{2,50}$/;


                // Email
                let emailRegex =
                    /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;


                // Mobile
                let mobileRegex =
                    /^[6-9][0-9]{9}$/;


                // Password
                let passwordRegex =
                    /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[@$!%*?&])[A-Za-z0-9@$!%*?&]{8,}$/;


                /* =========================
                   NAME VALIDATION
                ========================== */

                if (!nameRegex.test(name)) {

                    nameError.textContent =
                        "❌ Name must contain only alphabets and spaces.";

                    isValid = false;

                }


                /* =========================
                   EMAIL VALIDATION
                ========================== */

                if (!emailRegex.test(email)) {

                    emailError.textContent =
                        "❌ Please enter a valid email address.";

                    isValid = false;

                }


                /* =========================
                   MOBILE VALIDATION
                ========================== */

                if (!mobileRegex.test(mobile)) {

                    mobileError.textContent =
                        "❌ Enter a valid 10-digit mobile number.";

                    isValid = false;

                }


                /* =========================
                   PASSWORD VALIDATION
                ========================== */

                if (!passwordRegex.test(password)) {

                    passwordError.textContent =
                        "❌ Password must contain 8+ characters, uppercase, lowercase, number and special character.";

                    isValid = false;

                }


                /* =========================
                   CONFIRM PASSWORD
                ========================== */

                if (password !== confirmPassword) {

                    confirmPasswordError.textContent =
                        "❌ Passwords do not match.";

                    isValid = false;

                }


                /* =========================
                   COURSE
                ========================== */

                if (course === "") {

                    courseError.textContent =
                        "❌ Please select a course.";

                    isValid = false;

                }


                /* =========================
                   YEAR
                ========================== */

                if (year === "") {

                    yearError.textContent =
                        "❌ Please select your academic year.";

                    isValid = false;

                }


                /* =========================
                   GENDER
                ========================== */

                if (!gender) {

                    genderError.textContent =
                        "❌ Please select your gender.";

                    isValid = false;

                }


                /* =========================
                   TERMS
                ========================== */

                if (!terms) {

                    termsError.textContent =
                        "❌ You must accept the terms and conditions.";

                    isValid = false;

                }


                /* =========================
                   SUCCESS
                ========================== */

                if (isValid) {

                    successMessage.style.display = "block";

                    successMessage.textContent =
                        "🎉 Registration Successful! Welcome to Student Portal.";

                    document
                        .getElementById("registrationForm")
                        .reset();

                }


            });

    </script>

</body>
</html>
